<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWN Skin / Checkout</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="top-bar">
    <nav>
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="shop.html">Shop</a>
      <a href="quiz.html">Questionnaire</a>
      <a href="recommendation.html">Recommendation</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </header>

  <header class="page-header">
  
    <div class="title-area">
      <h1>Checkout</h1>
    </div>

  </header>

  <main class="checkout-main">
    <section class="checkout-box">
      <h2>Your Bag</h2>

      <div id="checkoutItems"></div>

      <div class="checkout-total-row">
        <strong>Subtotal</strong>
        <strong id="checkoutTotal">$0.00</strong>
      </div>
    </section>

    <section class="checkout-box">
      <h2>Payment Method</h2>

      <form onsubmit="placeOrder(event)">
        <p><label><input type="radio" name="payment" checked> Apple Pay</label></p>
        <p><label><input type="radio" name="payment"> Credit / Debit Card</label></p>
        <p><label><input type="radio" name="payment"> PayPal</label></p>

        <input class="checkout-input" type="text" placeholder="Full Name" required>
        <input class="checkout-input" type="text" placeholder="Address" required>
        <input class="checkout-input" type="text" placeholder="City" required>
        <input class="checkout-input" type="text" placeholder="ZIP Code" required>
        <input class="checkout-input" type="text" placeholder="Cardholder Name">
        <input class="checkout-input" type="text" placeholder="Card Number">
        <input class="checkout-input" type="text" placeholder="MM/YY">
        <input class="checkout-input" type="text" placeholder="CVV">

        <button type="submit" class="checkout-place-order-btn">Place Order</button>
      </form>
    </section>
  </main>

  <script src="../shop.js"></script>
</body>
</html>
